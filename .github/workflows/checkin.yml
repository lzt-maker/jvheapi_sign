name: 自动签到任务

on:
  schedule:
    # 每天 UTC 时间凌晨 1 点执行（对应北京时间早上 9 点）
    - cron: '40 16 * * *'
  workflow_dispatch: # 允许在 GitHub 网页端手动点击运行

jobs:
  run-checkin:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # 可根据需要调整版本

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 运行签到脚本
        env:
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
        run: python checkin_jhapi.py
